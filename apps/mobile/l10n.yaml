# Localization configuration (§ Arabic-first, RTL).
#
# Arabic is the source locale; English is provided so the codebase does not
# hard-code a single language before copy is finalised.
arb-dir: lib/l10n/arb
template-arb-file: app_ar.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
nullable-getter: false
use-escaping: true
